# Complete server block for m3listing.
#
# Requires nginx built with --with-http_addition_module and --with-http_sub_module
# (both present in the official nginx Docker images).

server {
    listen 80 default_server;
    server_name _;

    location / {
        root /var/www/html/;
        try_files $uri $uri/ =404;

        autoindex on;
        autoindex_localtime on;
        autoindex_exact_size off;   # "on" gives exact byte counts — also supported
        charset utf-8;              # required for non-ASCII file names

        # wrap the listing
        add_before_body /.m3listing/top.html;
        add_after_body  /.m3listing/bot.html;

        # nginx emits a whole document; drop the tags that would duplicate
        # the ones top.html already opened
        sub_filter '<html>' '';
        sub_filter '<head><title>Index of $uri</title></head>' '';
        sub_filter '<body bgcolor="white">' '';
        sub_filter '</body>' '';
        sub_filter '</html>' '';
        sub_filter_once on;
    }

    # Optional: let the browser cache the skin across directory navigations.
    # (The wrapper never applies to the .css/.js themselves — addition_types
    #  and sub_filter_types are both text/html only.)
    location ^~ /.m3listing/ {
        root /var/www/html/;
        autoindex off;
        expires 7d;
    }
}
